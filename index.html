<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Descubra NFTs selecionados de criadores emergentes e consagrados. Colecione arte digital rara na Kurio." />
    <meta name="theme-color" content="#140d0a" />
    <link rel="preload" href="/fonts/roboto-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kurio | Marketplace de NFTs</title>
    <script>
      // #root holds the prerendered home page (vite.config.ts). Another page, search parameters or
      // a stored session render differently: hide it before the first paint (src/main.tsx).
      try {
        if (location.pathname !== '/' || location.search || localStorage.getItem('nft:session')) {
          document.documentElement.classList.add('skip-prerender')
        }
      } catch {}
    </script>
    <style>
      .skip-prerender #root {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
